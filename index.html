    <script>
      window.addEventListener('unhandledrejection', function (e) {
        if (e.reason && (String(e.reason.message || '').includes('WebSocket') || String(e.reason.stack || '').includes('@vite/client'))) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function (e) {
        if (String(e.message || '').includes('WebSocket') || String(e.filename || '').includes('@vite/client')) {
          e.preventDefault();
        }
      });
