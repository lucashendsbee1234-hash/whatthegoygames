<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Asteroids 1979</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #000;
      color: #fff;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 500px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      border-bottom: 1px solid #333;
    }
    .board-container {
      position: relative;
      margin: 14px 0;
      border: 2px solid #fff;
      background: #000;
      box-shadow: 0 0 24px rgba(255, 255, 255, 0.1);
    }
    canvas { display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .btn {
      background: #fff;
      color: #000;
      border: none;
      padding: 10px 24px;
      font-family: monospace;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }
    .btn:hover { background: #ccc; }
    .controls {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .ctrl-btn {
      width: 48px;
      height: 48px;
      background: #111;
      border: 1px solid #444;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    .ctrl-btn:active { background: #333; }
    .hint { font-size: 11px; color: #777; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="header">
    <span>SCORE: <span id="scoreEl">0</span></span>
    <span>ASTEROIDS</span>
    <span>SHIPS: <span id="livesEl">3</span></span>
  </div>

  <div class="board-container">
    <canvas id="gameCanvas" width="480" height="420"></canvas>
    <div id="startOverlay" class="overlay">
      <h2 style="font-size: 26px; letter-spacing: 3px;">ASTEROIDS</h2>
      <p style="font-size: 12px; color: #aaa;">Rotate: Left/Right | Thrust: Up | Fire: Space</p>
      <button class="btn" id="startBtn">ENGAGE THRUSTERS</button>
    </div>
    <div id="gameOverOverlay" class="overlay" style="display: none;">
      <h2 style="font-size: 24px; letter-spacing: 2px;">SHIP DESTROYED</h2>
      <p style="font-size: 13px; color: #aaa;">Final Score: <span id="finalScore">0</span></p>
      <button class="btn" id="restartBtn">LAUNCH AGAIN</button>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="btnLeft">↺</button>
    <button class="ctrl-btn" id="btnThrust">▲</button>
    <button class="ctrl-btn" id="btnRight">↻</button>
    <button class="ctrl-btn" id="btnFire" style="width: 72px;">FIRE</button>
  </div>
  <div class="hint">Left/Right: Turn | Up: Thrust | Space: Shoot</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('scoreEl');
    const livesEl = document.getElementById('livesEl');
    const finalScoreEl = document.getElementById('finalScore');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');

    let score = 0;
    let lives = 3;
    let isPlaying = false;

    const ship = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      r: 12,
      angle: -Math.PI / 2,
      rotation: 0,
      thrusting: false,
      thrust: { x: 0, y: 0 }
    };

    let lasers = [];
    let asteroids = [];
    const keys = {};

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playBeep(freq, type = 'square', dur = 0.05) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function createAsteroid(x, y, r) {
      const vertCount = Math.floor(Math.random() * 4) + 8;
      const offsets = [];
      for (let i = 0; i < vertCount; i++) {
        offsets.push(Math.random() * 0.4 + 0.8);
      }
      return {
        x, y, r,
        xv: (Math.random() - 0.5) * (80 / r),
        yv: (Math.random() - 0.5) * (80 / r),
        angle: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.04,
        vertCount,
        offsets
      };
    }

    function spawnAsteroidBelt(num = 5) {
      asteroids = [];
      for (let i = 0; i < num; i++) {
        let x, y;
        do {
          x = Math.random() * canvas.width;
          y = Math.random() * canvas.height;
        } while (Math.hypot(x - ship.x, y - ship.y) < 100);
        asteroids.push(createAsteroid(x, y, 35));
      }
    }

    function shootLaser() {
      if (!isPlaying || lasers.length > 5) return;
      lasers.push({
        x: ship.x + (4 / 3) * ship.r * Math.cos(ship.angle),
        y: ship.y + (4 / 3) * ship.r * Math.sin(ship.angle),
        xv: 7 * Math.cos(ship.angle),
        yv: 7 * Math.sin(ship.angle),
        life: 50
      });
      playBeep(750, 'sawtooth', 0.05);
    }

    function update() {
      if (!isPlaying) return;

      // Handle Keys
      ship.rotation = 0;
      if (keys['ArrowLeft'] || keys['KeyA']) ship.rotation = -0.08;
      if (keys['ArrowRight'] || keys['KeyD']) ship.rotation = 0.08;
      ship.thrusting = keys['ArrowUp'] || keys['KeyW'];

      // Rotate Ship
      ship.angle += ship.rotation;

      // Thrust
      if (ship.thrusting) {
        ship.thrust.x += 0.15 * Math.cos(ship.angle);
        ship.thrust.y += 0.15 * Math.sin(ship.angle);
      } else {
        ship.thrust.x *= 0.985;
        ship.thrust.y *= 0.985;
      }

      ship.x += ship.thrust.x;
      ship.y += ship.thrust.y;

      // Wrap ship screen
      if (ship.x < 0) ship.x = canvas.width;
      else if (ship.x > canvas.width) ship.x = 0;
      if (ship.y < 0) ship.y = canvas.height;
      else if (ship.y > canvas.height) ship.y = 0;

      // Move Lasers
      for (let i = lasers.length - 1; i >= 0; i--) {
        const l = lasers[i];
        l.x += l.xv;
        l.y += l.yv;
        l.life--;

        if (l.x < 0) l.x = canvas.width; else if (l.x > canvas.width) l.x = 0;
        if (l.y < 0) l.y = canvas.height; else if (l.y > canvas.height) l.y = 0;

        if (l.life <= 0) lasers.splice(i, 1);
      }

      // Move Asteroids & Check Laser Hits
      for (let i = asteroids.length - 1; i >= 0; i--) {
        const a = asteroids[i];
        a.x += a.xv;
        a.y += a.yv;
        a.angle += a.rotSpeed;

        if (a.x < -a.r) a.x = canvas.width + a.r; else if (a.x > canvas.width + a.r) a.x = -a.r;
        if (a.y < -a.r) a.y = canvas.height + a.r; else if (a.y > canvas.height + a.r) a.y = -a.r;

        // Laser collisions
        for (let j = lasers.length - 1; j >= 0; j--) {
          const l = lasers[j];
          if (Math.hypot(a.x - l.x, a.y - l.y) < a.r) {
            lasers.splice(j, 1);
            score += Math.floor(1000 / a.r);
            scoreEl.textContent = score;
            playBeep(240, 'triangle', 0.1);

            // Split asteroid if big enough
            if (a.r > 15) {
              asteroids.push(createAsteroid(a.x, a.y, a.r / 2));
              asteroids.push(createAsteroid(a.x, a.y, a.r / 2));
            }
            asteroids.splice(i, 1);
            break;
          }
        }
      }

      // Check next wave
      if (asteroids.length === 0) {
        spawnAsteroidBelt(6);
      }

      // Ship collision with asteroids
      for (let a of asteroids) {
        if (Math.hypot(a.x - ship.x, a.y - ship.y) < a.r + ship.r - 2) {
          lives--;
          livesEl.textContent = lives;
          playBeep(120, 'sawtooth', 0.3);
          if (lives <= 0) {
            gameOver();
            return;
          } else {
            ship.x = canvas.width / 2;
            ship.y = canvas.height / 2;
            ship.thrust = { x: 0, y: 0 };
          }
          break;
        }
      }

      draw();
      requestAnimationFrame(update);
    }

    function draw() {
      // Space
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Ship
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      // Nose
      ctx.moveTo(
        ship.x + (4 / 3) * ship.r * Math.cos(ship.angle),
        ship.y + (4 / 3) * ship.r * Math.sin(ship.angle)
      );
      // Rear left
      ctx.lineTo(
        ship.x - ship.r * ((2 / 3) * Math.cos(ship.angle) + Math.sin(ship.angle)),
        ship.y - ship.r * ((2 / 3) * Math.sin(ship.angle) - Math.cos(ship.angle))
      );
      // Inward back
      ctx.lineTo(
        ship.x - (1 / 3) * ship.r * Math.cos(ship.angle),
        ship.y - (1 / 3) * ship.r * Math.sin(ship.angle)
      );
      // Rear right
      ctx.lineTo(
        ship.x - ship.r * ((2 / 3) * Math.cos(ship.angle) - Math.sin(ship.angle)),
        ship.y - ship.r * ((2 / 3) * Math.sin(ship.angle) + Math.cos(ship.angle))
      );
      ctx.closePath();
      ctx.stroke();

      // Draw Thrust flame
      if (ship.thrusting) {
        ctx.strokeStyle = '#888';
        ctx.beginPath();
        ctx.moveTo(
          ship.x - (2 / 3) * ship.r * Math.cos(ship.angle),
          ship.y - (2 / 3) * ship.r * Math.sin(ship.angle)
        );
        ctx.lineTo(
          ship.x - (5 / 3) * ship.r * Math.cos(ship.angle),
          ship.y - (5 / 3) * ship.r * Math.sin(ship.angle)
        );
        ctx.stroke();
      }

      // Draw Lasers
      ctx.fillStyle = '#ffffff';
      for (let l of lasers) {
        ctx.beginPath();
        ctx.arc(l.x, l.y, 2, 0, Math.PI * 2);
        ctx.fill();
      }

      // Draw Asteroids
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      for (let a of asteroids) {
        ctx.beginPath();
        for (let j = 0; j < a.vertCount; j++) {
          const ang = a.angle + (j * Math.PI * 2) / a.vertCount;
          const rad = a.r * a.offsets[j];
          const px = a.x + rad * Math.cos(ang);
          const py = a.y + rad * Math.sin(ang);
          if (j === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
      }
    }

    function gameOver() {
      isPlaying = false;
      finalScoreEl.textContent = score;
      gameOverOverlay.style.display = 'flex';
    }

    function startGame() {
      score = 0;
      lives = 3;
      scoreEl.textContent = '0';
      livesEl.textContent = '3';
      ship.x = canvas.width / 2;
      ship.y = canvas.height / 2;
      ship.angle = -Math.PI / 2;
      ship.thrust = { x: 0, y: 0 };
      lasers = [];
      spawnAsteroidBelt(4);
      startOverlay.style.display = 'none';
      gameOverOverlay.style.display = 'none';
      isPlaying = true;
      requestAnimationFrame(update);
    }

    document.getElementById('startBtn').onclick = startGame;
    document.getElementById('restartBtn').onclick = startGame;

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'Space') {
        shootLaser();
        e.preventDefault();
      }
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
        e.preventDefault();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    // Mobile buttons
    document.getElementById('btnLeft').onpointerdown = () => { keys['ArrowLeft'] = true; };
    document.getElementById('btnLeft').onpointerup = () => { keys['ArrowLeft'] = false; };
    document.getElementById('btnRight').onpointerdown = () => { keys['ArrowRight'] = true; };
    document.getElementById('btnRight').onpointerup = () => { keys['ArrowRight'] = false; };
    document.getElementById('btnThrust').onpointerdown = () => { keys['ArrowUp'] = true; };
    document.getElementById('btnThrust').onpointerup = () => { keys['ArrowUp'] = false; };
    document.getElementById('btnFire').onpointerdown = () => { shootLaser(); };

    draw();
  </script>
</body>
</html>
