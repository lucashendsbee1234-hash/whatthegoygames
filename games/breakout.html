<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Breakout Retro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #000;
      color: #fff;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 480px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      border-bottom: 1px solid #333;
    }
    .board-container {
      position: relative;
      margin: 16px 0;
      border: 3px solid #fff;
      background: #050505;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }
    canvas { display: block; cursor: crosshair; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .btn {
      background: #fff;
      color: #000;
      border: none;
      padding: 10px 24px;
      font-family: monospace;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
    }
    .btn:hover { background: #ccc; }
    .hint { font-size: 12px; color: #888; font-family: monospace; }
  </style>
</head>
<body>
  <div class="header">
    <span>SCORE: <span id="scoreEl">0</span></span>
    <span>BREAKOUT</span>
    <span>LIVES: <span id="livesEl">3</span></span>
  </div>

  <div class="board-container">
    <canvas id="gameCanvas" width="480" height="420"></canvas>
    <div id="startOverlay" class="overlay">
      <h2 style="font-size: 26px; letter-spacing: 3px;">BREAKOUT</h2>
      <p style="font-size: 12px; color: #aaa;">Mouse / Left & Right Arrows to steer paddle</p>
      <button class="btn" id="startBtn">START GAME</button>
    </div>
    <div id="gameOverOverlay" class="overlay" style="display: none;">
      <h2 id="endTitle" style="font-size: 24px; letter-spacing: 2px;">GAME OVER</h2>
      <p style="font-size: 13px; color: #aaa;">Score: <span id="finalScore">0</span></p>
      <button class="btn" id="restartBtn">PLAY AGAIN</button>
    </div>
  </div>

  <div class="hint">Move paddle using Mouse, Touch, or Arrow keys</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('scoreEl');
    const livesEl = document.getElementById('livesEl');
    const finalScoreEl = document.getElementById('finalScore');
    const endTitle = document.getElementById('endTitle');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');

    let score = 0;
    let lives = 3;
    let isPlaying = false;

    const paddle = {
      width: 75,
      height: 12,
      x: (canvas.width - 75) / 2,
      speed: 7
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height - 35,
      dx: 4,
      dy: -4,
      radius: 6
    };

    const brickRowCount = 5;
    const brickColumnCount = 7;
    const brickWidth = 56;
    const brickHeight = 16;
    const brickPadding = 8;
    const brickOffsetTop = 40;
    const brickOffsetLeft = (canvas.width - (brickColumnCount * (brickWidth + brickPadding) - brickPadding)) / 2;

    let bricks = [];

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playBeep(freq, dur = 0.05) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function initBricks() {
      bricks = [];
      for (let c = 0; c < brickColumnCount; c++) {
        bricks[c] = [];
        for (let r = 0; r < brickRowCount; r++) {
          bricks[c][r] = { x: 0, y: 0, status: 1 };
        }
      }
    }

    let rightPressed = false;
    let leftPressed = false;

    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowRight' || e.code === 'KeyD') rightPressed = true;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') leftPressed = true;
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowRight' || e.code === 'KeyD') rightPressed = false;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') leftPressed = false;
    });

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const relativeX = e.clientX - rect.left;
      if (relativeX > 0 && relativeX < canvas.width) {
        paddle.x = relativeX - paddle.width / 2;
      }
    });

    canvas.addEventListener('touchmove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const relativeX = e.touches[0].clientX - rect.left;
      if (relativeX > 0 && relativeX < canvas.width) {
        paddle.x = relativeX - paddle.width / 2;
      }
    }, { passive: true });

    function collisionDetection() {
      let activeBricks = 0;
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          const b = bricks[c][r];
          if (b.status === 1) {
            activeBricks++;
            if (
              ball.x > b.x &&
              ball.x < b.x + brickWidth &&
              ball.y > b.y &&
              ball.y < b.y + brickHeight
            ) {
              ball.dy = -ball.dy;
              b.status = 0;
              score += 20 * (brickRowCount - r);
              scoreEl.textContent = score;
              playBeep(450 + r * 60);
            }
          }
        }
      }

      if (activeBricks === 0) {
        // Victory!
        isPlaying = false;
        endTitle.textContent = 'YOU WIN!';
        finalScoreEl.textContent = score;
        gameOverOverlay.style.display = 'flex';
      }
    }

    function draw() {
      ctx.fillStyle = '#050505';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw bricks
      for (let c = 0; c < brickColumnCount; c++) {
        for (let r = 0; r < brickRowCount; r++) {
          if (bricks[c][r].status === 1) {
            const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
            const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
            bricks[c][r].x = brickX;
            bricks[c][r].y = brickY;

            // Grayscale gradient shades
            const shade = 255 - r * 35;
            ctx.fillStyle = `rgb(${shade}, ${shade}, ${shade})`;
            ctx.fillRect(brickX, brickY, brickWidth, brickHeight);
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            ctx.strokeRect(brickX, brickY, brickWidth, brickHeight);
          }
        }
      }

      // Draw Ball
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fill();

      // Draw Paddle
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(paddle.x, canvas.height - paddle.height - 10, paddle.width, paddle.height);
    }

    function update() {
      if (!isPlaying) return;

      if (rightPressed && paddle.x < canvas.width - paddle.width) {
        paddle.x += paddle.speed;
      } else if (leftPressed && paddle.x > 0) {
        paddle.x -= paddle.speed;
      }

      // Clamp paddle
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));

      // Wall bounce
      if (ball.x + ball.dx > canvas.width - ball.radius || ball.x + ball.dx < ball.radius) {
        ball.dx = -ball.dx;
        playBeep(300);
      }
      if (ball.y + ball.dy < ball.radius) {
        ball.dy = -ball.dy;
        playBeep(300);
      } else if (ball.y + ball.dy > canvas.height - paddle.height - 10 - ball.radius) {
        // Paddle hit check
        if (ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
          const hitPos = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
          ball.dx = hitPos * 5;
          ball.dy = -Math.abs(ball.dy);
          playBeep(500);
        } else if (ball.y + ball.dy > canvas.height - ball.radius) {
          // Ball fell through
          lives--;
          livesEl.textContent = lives;
          playBeep(180, 0.2);
          if (lives <= 0) {
            isPlaying = false;
            endTitle.textContent = 'GAME OVER';
            finalScoreEl.textContent = score;
            gameOverOverlay.style.display = 'flex';
            return;
          } else {
            ball.x = canvas.width / 2;
            ball.y = canvas.height - 35;
            ball.dx = 4 * (Math.random() > 0.5 ? 1 : -1);
            ball.dy = -4;
            paddle.x = (canvas.width - paddle.width) / 2;
          }
        }
      }

      ball.x += ball.dx;
      ball.y += ball.dy;

      collisionDetection();
      draw();
      requestAnimationFrame(update);
    }

    function startGame() {
      score = 0;
      lives = 3;
      scoreEl.textContent = '0';
      livesEl.textContent = '3';
      initBricks();
      ball.x = canvas.width / 2;
      ball.y = canvas.height - 35;
      ball.dx = 4;
      ball.dy = -4;
      paddle.x = (canvas.width - paddle.width) / 2;
      startOverlay.style.display = 'none';
      gameOverOverlay.style.display = 'none';
      isPlaying = true;
      requestAnimationFrame(update);
    }

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);

    initBricks();
    draw();
  </script>
</body>
</html>
