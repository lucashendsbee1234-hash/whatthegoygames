<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tetris Blocks</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #000;
      color: #fff;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .game-layout {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      margin-top: 10px;
    }
    .board-container {
      position: relative;
      border: 3px solid #fff;
      background: #050505;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }
    canvas#board { display: block; }
    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 110px;
    }
    .stat-box {
      border: 1px solid #444;
      padding: 8px;
      background: #111;
      text-align: center;
    }
    .stat-label { font-size: 10px; color: #888; letter-spacing: 1px; }
    .stat-value { font-size: 16px; font-weight: bold; margin-top: 4px; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      padding: 10px;
    }
    .btn {
      background: #fff;
      color: #000;
      border: none;
      padding: 8px 16px;
      font-family: monospace;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }
    .btn:hover { background: #ccc; }
    .controls {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .ctrl-btn {
      width: 44px;
      height: 44px;
      background: #151515;
      border: 1px solid #444;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    .ctrl-btn:active { background: #333; }
    .hint { font-size: 11px; color: #777; margin-top: 6px; }
  </style>
</head>
<body>
  <div style="font-weight: bold; font-size: 18px; letter-spacing: 3px; margin-bottom: 6px;">TETRIS BLOCKS</div>
  
  <div class="game-layout">
    <div class="board-container">
      <canvas id="board" width="200" height="400"></canvas>
      <div id="startOverlay" class="overlay">
        <h3 style="letter-spacing: 2px;">TETRIS</h3>
        <p style="font-size: 11px; color: #aaa;">Arrows: Move / Rotate<br>Space: Hard Drop</p>
        <button class="btn" id="startBtn">START</button>
      </div>
      <div id="gameOverOverlay" class="overlay" style="display: none;">
        <h3>GAME OVER</h3>
        <p style="font-size: 12px; color: #aaa;">Score: <span id="finalScore">0</span></p>
        <button class="btn" id="restartBtn">PLAY AGAIN</button>
      </div>
    </div>

    <div class="side-panel">
      <div class="stat-box">
        <div class="stat-label">NEXT</div>
        <canvas id="nextCanvas" width="80" height="80" style="margin-top: 6px;"></canvas>
      </div>
      <div class="stat-box">
        <div class="stat-label">SCORE</div>
        <div class="stat-value" id="scoreEl">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">LINES</div>
        <div class="stat-value" id="linesEl">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">LEVEL</div>
        <div class="stat-value" id="levelEl">1</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="btnLeft">◀</button>
    <button class="ctrl-btn" id="btnRotate">↻</button>
    <button class="ctrl-btn" id="btnRight">▶</button>
    <button class="ctrl-btn" id="btnDown">▼</button>
    <button class="ctrl-btn" id="btnDrop" style="width: 58px;">DROP</button>
  </div>
  <div class="hint">Arrows: Move/Rotate | Down: Soft Drop | Space: Hard Drop</div>

  <script>
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('nextCanvas');
    const nextCtx = nextCanvas.getContext('2d');

    const scoreEl = document.getElementById('scoreEl');
    const linesEl = document.getElementById('linesEl');
    const levelEl = document.getElementById('levelEl');
    const finalScoreEl = document.getElementById('finalScore');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');

    const COLS = 10;
    const ROWS = 20;
    const BLOCK_SIZE = 20;

    let grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    let score = 0;
    let lines = 0;
    let level = 1;
    let isRunning = false;
    let dropCounter = 0;
    let dropInterval = 800;
    let lastTime = 0;

    // Monochrome patterns / grayscale shading
    const SHAPES = [
      [],
      [[1, 1, 1, 1]], // I
      [[1, 1], [1, 1]], // O
      [[0, 1, 0], [1, 1, 1]], // T
      [[1, 0, 0], [1, 1, 1]], // J
      [[0, 0, 1], [1, 1, 1]], // L
      [[0, 1, 1], [1, 1, 0]], // S
      [[1, 1, 0], [0, 1, 1]]  // Z
    ];

    const COLORS = [
      '#000000',
      '#ffffff',
      '#eeeeee',
      '#dddddd',
      '#cccccc',
      '#bbbbbb',
      '#aaaaaa',
      '#999999'
    ];

    let currentPiece = null;
    let nextPiece = null;

    // Web Audio synthesizer
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playTone(freq, dur = 0.05) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function createPiece(type) {
      return {
        type: type,
        matrix: SHAPES[type],
        x: Math.floor(COLS / 2) - Math.ceil(SHAPES[type][0].length / 2),
        y: 0
      };
    }

    function randomPiece() {
      const type = Math.floor(Math.random() * 7) + 1;
      return createPiece(type);
    }

    function collide(grid, piece) {
      const m = piece.matrix;
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 && (grid[y + piece.y] && grid[y + piece.y][x + piece.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    function merge(grid, piece) {
      piece.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            grid[y + piece.y][x + piece.x] = piece.type;
          }
        });
      });
    }

    function rotate(matrix) {
      return matrix[0].map((_, i) => matrix.map(row => row[i]).reverse());
    }

    function playerRotate() {
      const oldMatrix = currentPiece.matrix;
      currentPiece.matrix = rotate(currentPiece.matrix);
      // Wall kick
      let offset = 1;
      while (collide(grid, currentPiece)) {
        currentPiece.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > currentPiece.matrix[0].length) {
          currentPiece.matrix = oldMatrix;
          return;
        }
      }
      playTone(380);
    }

    function clearLines() {
      let rowCount = 0;
      outer: for (let y = ROWS - 1; y >= 0; --y) {
        for (let x = 0; x < COLS; ++x) {
          if (grid[y][x] === 0) continue outer;
        }
        const row = grid.splice(y, 1)[0].fill(0);
        grid.unshift(row);
        ++y;
        rowCount++;
      }
      if (rowCount > 0) {
        const points = [0, 100, 300, 500, 800];
        score += (points[rowCount] || 1000) * level;
        lines += rowCount;
        level = Math.floor(lines / 10) + 1;
        dropInterval = Math.max(100, 800 - (level - 1) * 70);
        scoreEl.textContent = score;
        linesEl.textContent = lines;
        levelEl.textContent = level;
        playTone(600, 0.15);
      }
    }

    function drawBlock(c, x, y, color, isGhost = false) {
      if (isGhost) {
        c.strokeStyle = '#555';
        c.lineWidth = 1;
        c.strokeRect(x * BLOCK_SIZE + 1, y * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
      } else {
        c.fillStyle = color;
        c.fillRect(x * BLOCK_SIZE + 1, y * BLOCK_SIZE + 1, BLOCK_SIZE - 2, BLOCK_SIZE - 2);
        // Bevel highlight
        c.strokeStyle = '#fff';
        c.lineWidth = 1;
        c.strokeRect(x * BLOCK_SIZE + 2, y * BLOCK_SIZE + 2, BLOCK_SIZE - 4, BLOCK_SIZE - 4);
      }
    }

    function getGhostY() {
      let ghostY = currentPiece.y;
      while (!collide(grid, { ...currentPiece, y: ghostY + 1 })) {
        ghostY++;
      }
      return ghostY;
    }

    function draw() {
      // Board
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid lines
      ctx.strokeStyle = '#141414';
      ctx.lineWidth = 1;
      for (let x = 0; x <= canvas.width; x += BLOCK_SIZE) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
      }
      for (let y = 0; y <= canvas.height; y += BLOCK_SIZE) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
      }

      // Placed blocks
      grid.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            drawBlock(ctx, x, y, COLORS[value]);
          }
        });
      });

      if (currentPiece) {
        // Ghost piece
        const ghostY = getGhostY();
        currentPiece.matrix.forEach((row, y) => {
          row.forEach((value, x) => {
            if (value !== 0) {
              drawBlock(ctx, x + currentPiece.x, y + ghostY, null, true);
            }
          });
        });

        // Active piece
        currentPiece.matrix.forEach((row, y) => {
          row.forEach((value, x) => {
            if (value !== 0) {
              drawBlock(ctx, x + currentPiece.x, y + currentPiece.y, COLORS[currentPiece.type]);
            }
          });
        });
      }

      // Next piece canvas
      nextCtx.fillStyle = '#111';
      nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
      if (nextPiece) {
        const m = nextPiece.matrix;
        const offsetX = (nextCanvas.width - m[0].length * 16) / 2;
        const offsetY = (nextCanvas.height - m.length * 16) / 2;
        m.forEach((row, y) => {
          row.forEach((val, x) => {
            if (val !== 0) {
              nextCtx.fillStyle = '#fff';
              nextCtx.fillRect(offsetX + x * 16 + 1, offsetY + y * 16 + 1, 14, 14);
            }
          });
        });
      }
    }

    function playerDrop() {
      currentPiece.y++;
      if (collide(grid, currentPiece)) {
        currentPiece.y--;
        merge(grid, currentPiece);
        clearLines();
        currentPiece = nextPiece;
        nextPiece = randomPiece();
        if (collide(grid, currentPiece)) {
          gameOver();
          return;
        }
      }
      dropCounter = 0;
    }

    function hardDrop() {
      if (!isRunning) return;
      currentPiece.y = getGhostY();
      merge(grid, currentPiece);
      clearLines();
      currentPiece = nextPiece;
      nextPiece = randomPiece();
      playTone(280, 0.08);
      if (collide(grid, currentPiece)) {
        gameOver();
        return;
      }
      dropCounter = 0;
    }

    function playerMove(dir) {
      if (!isRunning) return;
      currentPiece.x += dir;
      if (collide(grid, currentPiece)) {
        currentPiece.x -= dir;
      } else {
        playTone(320, 0.03);
      }
    }

    function update(time = 0) {
      if (!isRunning) return;
      const deltaTime = time - lastTime;
      lastTime = time;

      dropCounter += deltaTime;
      if (dropCounter > dropInterval) {
        playerDrop();
      }

      draw();
      requestAnimationFrame(update);
    }

    function gameOver() {
      isRunning = false;
      playTone(150, 0.3);
      finalScoreEl.textContent = score;
      gameOverOverlay.style.display = 'flex';
    }

    function startGame() {
      grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
      score = 0;
      lines = 0;
      level = 1;
      dropInterval = 800;
      scoreEl.textContent = '0';
      linesEl.textContent = '0';
      levelEl.textContent = '1';
      currentPiece = randomPiece();
      nextPiece = randomPiece();
      startOverlay.style.display = 'none';
      gameOverOverlay.style.display = 'none';
      isRunning = true;
      lastTime = performance.now();
      requestAnimationFrame(update);
    }

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);

    window.addEventListener('keydown', (e) => {
      if (!isRunning) return;
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') { playerMove(-1); e.preventDefault(); }
      else if (e.code === 'ArrowRight' || e.code === 'KeyD') { playerMove(1); e.preventDefault(); }
      else if (e.code === 'ArrowDown' || e.code === 'KeyS') { playerDrop(); e.preventDefault(); }
      else if (e.code === 'ArrowUp' || e.code === 'KeyW') { playerRotate(); e.preventDefault(); }
      else if (e.code === 'Space') { hardDrop(); e.preventDefault(); }
    });

    document.getElementById('btnLeft').onclick = () => playerMove(-1);
    document.getElementById('btnRight').onclick = () => playerMove(1);
    document.getElementById('btnRotate').onclick = () => playerRotate();
    document.getElementById('btnDown').onclick = () => playerDrop();
    document.getElementById('btnDrop').onclick = () => hardDrop();

    draw();
  </script>
</body>
</html>
