<!DOCTYPE html><html><head><meta charset="utf-8"><title>2048</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#111;color:#fff;font-family:sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0}#grid{display:grid;grid-template-columns:repeat(4,70px);grid-gap:10px;background:#222;padding:10px;border-radius:6px}.cell{width:70px;height:70px;background:#333;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;border-radius:4px}.c2{background:#eee4da;color:#776e65}.c4{background:#ede0c8;color:#776e65}.c8{background:#f2b179;color:#fff}.c16{background:#f59563;color:#fff}.c32{background:#f67c5f;color:#fff}.c64{background:#f65e3b;color:#fff}.c128{background:#edcf72;color:#fff}.c256{background:#edcc61;color:#fff}.c512{background:#edc850;color:#fff}.c1024{background:#edc53f;color:#fff}.c2048{background:#edc22e;color:#fff}#score{font-size:20px;margin-bottom:15px;font-family:monospace}</style></head><body><div id="score">SCORE: <span id="s">0</span></div><div id="grid"></div><p style="font-size:12px;color:#888;margin-top:15px">Use Arrow Keys or Swipe to play</p><script>let b=Array(16).fill(0),sc=0;function sp(){let e=[];b.forEach((v,i)=>{if(!v)e.push(i)});if(e.length){b[e[Math.floor(Math.random()*e.length)]]=Math.random()<0.9?2:4;}}function d(){let g=document.getElementById("grid");g.innerHTML="";b.forEach(v=>{let d=document.createElement("div");d.className="cell "+(v?"c"+v:"");d.innerText=v||"";g.appendChild(d);});document.getElementById("s").innerText=sc;}function slide(r){let f=r.filter(v=>v);for(let i=0;i<f.length-1;i++){if(f[i]===f[i+1]){f[i]*=2;sc+=f[i];f.splice(i+1,1);}}while(f.length<4)f.push(0);return f;}function mv(dir){let old=[...b];if(dir==="ArrowLeft"||dir==="ArrowRight"){for(let i=0;i<4;i++){let r=b.slice(i*4,i*4+4);if(dir==="ArrowRight")r.reverse();r=slide(r);if(dir==="ArrowRight")r.reverse();for(let j=0;j<4;j++)b[i*4+j]=r[j];}}else{for(let j=0;j<4;j++){let c=[b[j],b[j+4],b[j+8],b[j+12]];if(dir==="ArrowDown")c.reverse();c=slide(c);if(dir==="ArrowDown")c.reverse();for(let i=0;i<4;i++)b[i*4+j]=c[i];}}if(old.some((v,i)=>v!==b[i])){sp();d();}}window.addEventListener("keydown",e=>{if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.key)){e.preventDefault();mv(e.key);}});sp();sp();d();</script></body></html>
