<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Dash</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #000;
      color: #fff;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 400px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      border-bottom: 1px solid #333;
    }
    .board-container {
      position: relative;
      margin: 16px 0;
      border: 3px solid #fff;
      background: #050505;
      box-shadow: 0 0 24px rgba(255, 255, 255, 0.12);
    }
    canvas { display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      backdrop-filter: blur(2px);
    }
    .btn {
      background: #fff;
      color: #000;
      border: none;
      padding: 12px 28px;
      font-family: monospace;
      font-size: 15px;
      font-weight: 900;
      cursor: pointer;
      letter-spacing: 1px;
    }
    .btn:hover { background: #ccc; }
    .hint { font-size: 12px; color: #888; font-family: monospace; }
  </style>
</head>
<body>
  <div class="header">
    <span>FLAPPY DASH</span>
    <span>SCORE: <span id="scoreEl">0</span></span>
    <span>BEST: <span id="bestEl">0</span></span>
  </div>

  <div class="board-container">
    <canvas id="gameCanvas" width="360" height="480"></canvas>
    <div id="startOverlay" class="overlay">
      <h2 style="font-size: 26px; letter-spacing: 3px;">FLAPPY DASH</h2>
      <p style="font-size: 13px; color: #aaa;">Space / Click / Tap to jump</p>
      <button class="btn" id="startBtn">START FLAPPING</button>
    </div>
    <div id="gameOverOverlay" class="overlay" style="display: none;">
      <h2 style="font-size: 24px; letter-spacing: 2px;">CRASHED!</h2>
      <p style="font-size: 14px; color: #bbb;">Score: <span id="finalScore">0</span></p>
      <button class="btn" id="restartBtn">TRY AGAIN</button>
    </div>
  </div>

  <div class="hint">Press Spacebar, Up Arrow, or Click anywhere to flap</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('scoreEl');
    const bestEl = document.getElementById('bestEl');
    const finalScoreEl = document.getElementById('finalScore');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');

    let bestScore = parseInt(localStorage.getItem('flappy_best') || '0', 10);
    bestEl.textContent = bestScore;

    const bird = {
      x: 60,
      y: 200,
      radius: 12,
      velocity: 0,
      gravity: 0.35,
      jump: -6.5
    };

    let pipes = [];
    let pipeSpeed = 2.2;
    let pipeGap = 130;
    let pipeFreq = 100;
    let frame = 0;
    let score = 0;
    let isPlaying = false;
    let animationId = null;

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playBeep(freq, type = 'square', dur = 0.08) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function flap() {
      if (!isPlaying) return;
      bird.velocity = bird.jump;
      playBeep(440, 'triangle', 0.06);
    }

    function spawnPipe() {
      const minTop = 40;
      const maxTop = canvas.height - pipeGap - 80;
      const topHeight = Math.floor(Math.random() * (maxTop - minTop)) + minTop;
      pipes.push({
        x: canvas.width,
        top: topHeight,
        bottom: canvas.height - topHeight - pipeGap,
        passed: false
      });
    }

    function update() {
      if (!isPlaying) return;
      frame++;

      bird.velocity += bird.gravity;
      bird.y += bird.velocity;

      // Spawn pipes
      if (frame % pipeFreq === 0) {
        spawnPipe();
      }

      // Update pipes
      for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= pipeSpeed;

        // Check score
        if (!p.passed && p.x + 40 < bird.x) {
          p.passed = true;
          score++;
          scoreEl.textContent = score;
          playBeep(600, 'square', 0.08);
          if (score > bestScore) {
            bestScore = score;
            bestEl.textContent = bestScore;
            localStorage.setItem('flappy_best', bestScore);
          }
        }

        // Collision check
        const birdLeft = bird.x - bird.radius + 3;
        const birdRight = bird.x + bird.radius - 3;
        const birdTop = bird.y - bird.radius + 3;
        const birdBottom = bird.y + bird.radius - 3;

        if (birdRight > p.x && birdLeft < p.x + 40) {
          if (birdTop < p.top || birdBottom > canvas.height - p.bottom) {
            gameOver();
            return;
          }
        }

        // Remove offscreen
        if (p.x < -50) {
          pipes.splice(i, 1);
        }
      }

      // Floor & ceiling collision
      if (bird.y + bird.radius >= canvas.height - 15 || bird.y - bird.radius <= 0) {
        gameOver();
        return;
      }

      draw();
      animationId = requestAnimationFrame(update);
    }

    function draw() {
      // Clear
      ctx.fillStyle = '#050505';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Stars/Dots in background
      ctx.fillStyle = '#222';
      for (let i = 10; i < canvas.width; i += 30) {
        ctx.fillRect(i, ((i * 17) % canvas.height), 2, 2);
      }

      // Draw pipes
      ctx.fillStyle = '#ffffff';
      pipes.forEach(p => {
        // Top pipe
        ctx.fillRect(p.x, 0, 40, p.top);
        ctx.fillRect(p.x - 3, p.top - 15, 46, 15);

        // Bottom pipe
        const bottomY = canvas.height - p.bottom;
        ctx.fillRect(p.x, bottomY, 40, p.bottom);
        ctx.fillRect(p.x - 3, bottomY, 46, 15);
      });

      // Ground line
      ctx.strokeStyle = '#444';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height - 15);
      ctx.lineTo(canvas.width, canvas.height - 15);
      ctx.stroke();

      // Bird
      ctx.save();
      ctx.translate(bird.x, bird.y);
      const angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (bird.velocity * 0.08)));
      ctx.rotate(angle);

      // Body
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
      ctx.fill();

      // Wing
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.ellipse(-4, 2, 6, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(5, -4, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#888';
      ctx.beginPath();
      ctx.moveTo(10, -2);
      ctx.lineTo(16, 2);
      ctx.lineTo(10, 6);
      ctx.fill();

      ctx.restore();
    }

    function gameOver() {
      isPlaying = false;
      cancelAnimationFrame(animationId);
      playBeep(180, 'sawtooth', 0.25);
      finalScoreEl.textContent = score;
      gameOverOverlay.style.display = 'flex';
    }

    function startGame() {
      bird.y = 200;
      bird.velocity = 0;
      pipes = [];
      frame = 0;
      score = 0;
      scoreEl.textContent = '0';
      startOverlay.style.display = 'none';
      gameOverOverlay.style.display = 'none';
      isPlaying = true;
      animationId = requestAnimationFrame(update);
    }

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);

    window.addEventListener('keydown', (e) => {
      if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
        e.preventDefault();
        if (!isPlaying && (startOverlay.style.display !== 'none' || gameOverOverlay.style.display !== 'none')) {
          startGame();
        } else {
          flap();
        }
      }
    });

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (!isPlaying) startGame();
      else flap();
    });

    draw();
  </script>
</body>
</html>
