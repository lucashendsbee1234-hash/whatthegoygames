<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake Classic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 480px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      border-bottom: 1px solid #333;
    }
    .board-container {
      position: relative;
      margin: 16px 0;
      border: 2px solid #fff;
      background: #050505;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }
    canvas {
      display: block;
      background: #000;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      backdrop-filter: blur(2px);
    }
    .btn {
      background: #fff;
      color: #000;
      border: none;
      padding: 10px 24px;
      font-family: monospace;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: background 0.1s;
    }
    .btn:hover { background: #ccc; }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 48px);
      gap: 6px;
      margin-top: 8px;
    }
    .ctrl-btn {
      width: 48px;
      height: 48px;
      background: #111;
      border: 1px solid #444;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .ctrl-btn:active { background: #333; }
    .hint { font-size: 11px; color: #777; margin-top: 8px; font-family: monospace; }
  </style>
</head>
<body>
  <div class="header">
    <span>SNAKE</span>
    <span>SCORE: <span id="scoreVal">0</span></span>
    <span>BEST: <span id="bestVal">0</span></span>
  </div>

  <div class="board-container">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="startOverlay" class="overlay">
      <h2 style="letter-spacing: 2px; font-size: 24px;">SNAKE CLASSIC</h2>
      <p style="font-size: 13px; color: #aaa;">Arrow keys / WASD to move</p>
      <button class="btn" id="startBtn">START GAME</button>
    </div>
    <div id="gameOverOverlay" class="overlay" style="display: none;">
      <h2 style="letter-spacing: 2px; font-size: 24px; color: #fff;">GAME OVER</h2>
      <p style="font-size: 14px; color: #bbb;">Final Score: <span id="finalScoreVal">0</span></p>
      <button class="btn" id="restartBtn">PLAY AGAIN</button>
    </div>
  </div>

  <div class="controls">
    <div></div>
    <button class="ctrl-btn" id="btnUp">▲</button>
    <div></div>
    <button class="ctrl-btn" id="btnLeft">◀</button>
    <button class="ctrl-btn" id="btnDown">▼</button>
    <button class="ctrl-btn" id="btnRight">▶</button>
  </div>
  <div class="hint">Use Arrow Keys, WASD, or Buttons</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');
    const bestVal = document.getElementById('bestVal');
    const finalScoreVal = document.getElementById('finalScoreVal');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');

    const GRID_SIZE = 20;
    const TILE_COUNT = canvas.width / GRID_SIZE;

    let snake = [];
    let food = { x: 15, y: 15 };
    let dx = 1, dy = 0;
    let nextDx = 1, nextDy = 0;
    let score = 0;
    let best = parseInt(localStorage.getItem('snake_highscore') || '0', 10);
    bestVal.textContent = best;
    let gameLoopId = null;
    let isRunning = false;
    let speed = 90; // ms

    // Simple Web Audio beeps
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playBeep(freq, type = 'square', duration = 0.08) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * TILE_COUNT);
        food.y = Math.floor(Math.random() * TILE_COUNT);
        valid = !snake.some(segment => segment.x === food.x && segment.y === food.y);
      }
    }

    function initGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dx = 1; dy = 0;
      nextDx = 1; nextDy = 0;
      score = 0;
      scoreVal.textContent = '0';
      spawnFood();
    }

    function draw() {
      // Clear
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid subtle lines
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 1;
      for (let i = 0; i <= canvas.width; i += GRID_SIZE) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Food
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(food.x * GRID_SIZE + 2, food.y * GRID_SIZE + 2, GRID_SIZE - 4, GRID_SIZE - 4);

      // Snake
      snake.forEach((segment, index) => {
        if (index === 0) {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(segment.x * GRID_SIZE + 1, segment.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2);
          // Eyes
          ctx.fillStyle = '#000000';
          const eyeSize = 3;
          ctx.fillRect(segment.x * GRID_SIZE + 4, segment.y * GRID_SIZE + 4, eyeSize, eyeSize);
          ctx.fillRect(segment.x * GRID_SIZE + 12, segment.y * GRID_SIZE + 4, eyeSize, eyeSize);
        } else {
          ctx.fillStyle = '#cccccc';
          ctx.fillRect(segment.x * GRID_SIZE + 2, segment.y * GRID_SIZE + 2, GRID_SIZE - 4, GRID_SIZE - 4);
        }
      });
    }

    function update() {
      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        gameOver();
        return;
      }

      // Self collision
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      // Eat food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreVal.textContent = score;
        if (score > best) {
          best = score;
          bestVal.textContent = best;
          localStorage.setItem('snake_highscore', best);
        }
        playBeep(640, 'triangle', 0.1);
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function gameOver() {
      isRunning = false;
      clearInterval(gameLoopId);
      playBeep(180, 'sawtooth', 0.3);
      finalScoreVal.textContent = score;
      gameOverOverlay.style.display = 'flex';
    }

    function start() {
      initGame();
      startOverlay.style.display = 'none';
      gameOverOverlay.style.display = 'none';
      isRunning = true;
      draw();
      if (gameLoopId) clearInterval(gameLoopId);
      gameLoopId = setInterval(update, speed);
    }

    document.getElementById('startBtn').addEventListener('click', start);
    document.getElementById('restartBtn').addEventListener('click', start);

    function changeDir(newDx, newDy) {
      if (!isRunning) return;
      if ((newDx !== 0 && dx === -newDx) || (newDy !== 0 && dy === -newDy)) return;
      nextDx = newDx;
      nextDy = newDy;
      playBeep(400, 'square', 0.02);
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) { changeDir(0, -1); e.preventDefault(); }
      else if (['ArrowDown', 'KeyS'].includes(e.code)) { changeDir(0, 1); e.preventDefault(); }
      else if (['ArrowLeft', 'KeyA'].includes(e.code)) { changeDir(-1, 0); e.preventDefault(); }
      else if (['ArrowRight', 'KeyD'].includes(e.code)) { changeDir(1, 0); e.preventDefault(); }
      else if (e.code === 'Space' && !isRunning) { start(); e.preventDefault(); }
    });

    document.getElementById('btnUp').onclick = () => changeDir(0, -1);
    document.getElementById('btnDown').onclick = () => changeDir(0, 1);
    document.getElementById('btnLeft').onclick = () => changeDir(-1, 0);
    document.getElementById('btnRight').onclick = () => changeDir(1, 0);

    draw();
  </script>
</body>
</html>
