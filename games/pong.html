<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pong Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #000;
      color: #fff;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 600px;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      border-bottom: 1px solid #333;
    }
    .board-container {
      position: relative;
      margin: 16px 0;
      border: 3px solid #fff;
      background: #000;
      box-shadow: 0 0 24px rgba(255, 255, 255, 0.12);
    }
    canvas { display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      backdrop-filter: blur(2px);
    }
    .btn {
      background: #fff;
      color: #000;
      border: none;
      padding: 10px 24px;
      font-family: monospace;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      letter-spacing: 1px;
    }
    .btn:hover { background: #ccc; }
    .mode-select {
      display: flex;
      gap: 10px;
    }
    .mode-btn {
      background: #111;
      color: #fff;
      border: 1px solid #555;
      padding: 8px 16px;
      font-family: monospace;
      cursor: pointer;
    }
    .mode-btn.active {
      background: #fff;
      color: #000;
      border-color: #fff;
    }
    .hint { font-size: 12px; color: #888; font-family: monospace; text-align: center; max-width: 500px; }
  </style>
</head>
<body>
  <div class="header">
    <span>P1: <span id="p1Score">0</span></span>
    <span>PONG</span>
    <span>P2: <span id="p2Score">0</span></span>
  </div>

  <div class="board-container">
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <div id="startOverlay" class="overlay">
      <h2 style="font-size: 28px; letter-spacing: 4px;">PONG</h2>
      <div class="mode-select">
        <button class="mode-btn active" id="btn1P">1 PLAYER (VS CPU)</button>
        <button class="mode-btn" id="btn2P">2 PLAYERS (LOCAL)</button>
      </div>
      <p style="font-size: 12px; color: #aaa;" id="ctrlHint">P1: W/S or Arrow Keys</p>
      <button class="btn" id="startBtn">SERVE BALL</button>
    </div>
    <div id="gameOverOverlay" class="overlay" style="display: none;">
      <h2 id="winnerText" style="font-size: 24px; letter-spacing: 2px;">PLAYER 1 WINS!</h2>
      <button class="btn" id="restartBtn">PLAY AGAIN</button>
    </div>
  </div>

  <div class="hint" id="footerHint">Controls: W/S or Mouse/Touch for Left Paddle | Up/Down for Right Paddle</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const p1ScoreEl = document.getElementById('p1Score');
    const p2ScoreEl = document.getElementById('p2Score');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const winnerText = document.getElementById('winnerText');
    const ctrlHint = document.getElementById('ctrlHint');

    let mode = '1p'; // '1p' or '2p'
    let isPlaying = false;
    let scoreP1 = 0;
    let scoreP2 = 0;
    const WINNING_SCORE = 7;

    const paddleWidth = 12;
    const paddleHeight = 70;
    let p1Y = (canvas.height - paddleHeight) / 2;
    let p2Y = (canvas.height - paddleHeight) / 2;
    let p1Speed = 0;
    let p2Speed = 0;
    const PADDLE_SPEED = 6;

    let ballX = canvas.width / 2;
    let ballY = canvas.height / 2;
    let ballSpeedX = 5;
    let ballSpeedY = 3;
    const ballSize = 10;

    const keys = {};

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playBeep(freq, dur = 0.08) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    document.getElementById('btn1P').onclick = () => {
      mode = '1p';
      document.getElementById('btn1P').classList.add('active');
      document.getElementById('btn2P').classList.remove('active');
      ctrlHint.textContent = 'P1: W/S or Mouse | CPU: Right';
    };
    document.getElementById('btn2P').onclick = () => {
      mode = '2p';
      document.getElementById('btn2P').classList.add('active');
      document.getElementById('btn1P').classList.remove('active');
      ctrlHint.textContent = 'P1: W/S | P2: Up/Down';
    };

    function resetBall(direction = 1) {
      ballX = canvas.width / 2;
      ballY = canvas.height / 2;
      ballSpeedX = (4 + Math.random() * 2) * direction;
      ballSpeedY = (Math.random() * 4 - 2);
    }

    function draw() {
      // Background
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Center dashed net
      ctx.strokeStyle = '#333333';
      ctx.setLineDash([8, 8]);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.setLineDash([]);

      // Paddles
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(20, p1Y, paddleWidth, paddleHeight);
      ctx.fillRect(canvas.width - 20 - paddleWidth, p2Y, paddleWidth, paddleHeight);

      // Ball
      ctx.fillRect(ballX - ballSize / 2, ballY - ballSize / 2, ballSize, ballSize);
    }

    function update() {
      if (!isPlaying) return;

      // Handle P1 movement
      if (keys['KeyW'] || keys['ArrowUp'] && mode === '1p') p1Y -= PADDLE_SPEED;
      if (keys['KeyS'] || keys['ArrowDown'] && mode === '1p') p1Y += PADDLE_SPEED;

      // Handle P2 movement
      if (mode === '2p') {
        if (keys['ArrowUp']) p2Y -= PADDLE_SPEED;
        if (keys['ArrowDown']) p2Y += PADDLE_SPEED;
      } else {
        // CPU AI tracking ball smoothly
        const centerP2 = p2Y + paddleHeight / 2;
        if (centerP2 < ballY - 14) p2Y += 4.5;
        else if (centerP2 > ballY + 14) p2Y -= 4.5;
      }

      // Clamp paddles
      p1Y = Math.max(0, Math.min(canvas.height - paddleHeight, p1Y));
      p2Y = Math.max(0, Math.min(canvas.height - paddleHeight, p2Y));

      // Move Ball
      ballX += ballSpeedX;
      ballY += ballSpeedY;

      // Top/Bottom bounce
      if (ballY - ballSize / 2 <= 0) {
        ballY = ballSize / 2;
        ballSpeedY = -ballSpeedY;
        playBeep(320);
      } else if (ballY + ballSize / 2 >= canvas.height) {
        ballY = canvas.height - ballSize / 2;
        ballSpeedY = -ballSpeedY;
        playBeep(320);
      }

      // Left paddle collision
      if (ballX - ballSize / 2 <= 20 + paddleWidth && ballX + ballSize / 2 >= 20) {
        if (ballY >= p1Y && ballY <= p1Y + paddleHeight) {
          ballSpeedX = Math.abs(ballSpeedX) * 1.05; // speed up slightly
          const hitOffset = (ballY - (p1Y + paddleHeight / 2)) / (paddleHeight / 2);
          ballSpeedY = hitOffset * 6;
          ballX = 20 + paddleWidth + ballSize / 2;
          playBeep(480);
        }
      }

      // Right paddle collision
      const p2Left = canvas.width - 20 - paddleWidth;
      if (ballX + ballSize / 2 >= p2Left && ballX - ballSize / 2 <= p2Left + paddleWidth) {
        if (ballY >= p2Y && ballY <= p2Y + paddleHeight) {
          ballSpeedX = -Math.abs(ballSpeedX) * 1.05;
          const hitOffset = (ballY - (p2Y + paddleHeight / 2)) / (paddleHeight / 2);
          ballSpeedY = hitOffset * 6;
          ballX = p2Left - ballSize / 2;
          playBeep(480);
        }
      }

      // Goal scored
      if (ballX < 0) {
        scoreP2++;
        p2ScoreEl.textContent = scoreP2;
        playBeep(200, 0.2);
        checkScore();
      } else if (ballX > canvas.width) {
        scoreP1++;
        p1ScoreEl.textContent = scoreP1;
        playBeep(600, 0.2);
        checkScore();
      }

      draw();
      requestAnimationFrame(update);
    }

    function checkScore() {
      if (scoreP1 >= WINNING_SCORE || scoreP2 >= WINNING_SCORE) {
        isPlaying = false;
        winnerText.textContent = scoreP1 >= WINNING_SCORE ? 'PLAYER 1 WINS!' : (mode === '1p' ? 'CPU WINS!' : 'PLAYER 2 WINS!');
        gameOverOverlay.style.display = 'flex';
      } else {
        resetBall(scoreP1 > scoreP2 ? -1 : 1);
      }
    }

    function startGame() {
      scoreP1 = 0;
      scoreP2 = 0;
      p1ScoreEl.textContent = '0';
      p2ScoreEl.textContent = '0';
      p1Y = (canvas.height - paddleHeight) / 2;
      p2Y = (canvas.height - paddleHeight) / 2;
      resetBall();
      startOverlay.style.display = 'none';
      gameOverOverlay.style.display = 'none';
      isPlaying = true;
      requestAnimationFrame(update);
    }

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('click', startGame);

    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (['ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
      if (e.code === 'Space' && !isPlaying) startGame();
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    // Mouse / Touch for Left Paddle
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const mouseY = e.clientY - rect.top;
      p1Y = mouseY - paddleHeight / 2;
    });

    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const touchY = e.touches[0].clientY - rect.top;
      p1Y = touchY - paddleHeight / 2;
    }, { passive: false });

    draw();
  </script>
</body>
</html>
