<!DOCTYPE html><html><head><meta charset="utf-8"><title>Flappy Bird</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background:#000;color:#fff;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden;font-family:sans-serif}canvas{border:2px solid #fff;background:#70c5ce}</style></head><body><canvas id="c" width="320" height="480"></canvas><p style="font-size:12px;color:#aaa">Press Space or Tap to Jump</p><script>const c=document.getElementById("c"),ctx=c.getContext("2d");let b={x:50,y:200,vy:0,g:0.25,j:-5.5,r:12},p=[],f=0,sc=0,over=false;function jump(){if(over){b.y=200;b.vy=0;p=[];sc=0;f=0;over=false;return;}b.vy=b.j;}window.addEventListener("keydown",e=>{if(e.code==="Space"){e.preventDefault();jump();}});window.addEventListener("click",jump);function loop(){f++;ctx.fillStyle="#70c5ce";ctx.fillRect(0,0,c.width,c.height);if(!over){b.vy+=b.g;b.y+=b.vy;if(f%90===0){let gap=110,top=Math.floor(Math.random()*(c.height-gap-100))+40;p.push({x:c.width,top,bot:c.height-top-gap});}}ctx.fillStyle="#73bf2e";p.forEach(pipe=>{if(!over)pipe.x-=2;ctx.fillRect(pipe.x,0,45,pipe.top);ctx.fillRect(pipe.x,c.height-pipe.bot,45,pipe.bot);if(!over&&b.x+b.r>pipe.x&&b.x-b.r<pipe.x+45){if(b.y-b.r<pipe.top||b.y+b.r>c.height-pipe.bot)over=true;}if(pipe.x===50&&!over)sc++;});p=p.filter(pipe=>pipe.x>-50);if(b.y+b.r>=c.height||b.y-b.r<=0)over=true;ctx.fillStyle="#f4d03f";ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.font="bold 20px monospace";ctx.fillText("SCORE: "+sc,10,30);if(over){ctx.fillStyle="rgba(0,0,0,0.6)";ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle="#fff";ctx.font="bold 24px monospace";ctx.textAlign="center";ctx.fillText("GAME OVER",c.width/2,c.height/2-10);ctx.font="14px monospace";ctx.fillText("TAP OR SPACE TO RETRY",c.width/2,c.height/2+25);ctx.textAlign="start";}requestAnimationFrame(loop);}loop();</script></body></html>
