<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>2048 Monochrome</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #000;
      color: #fff;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 360px;
      margin-bottom: 12px;
    }
    .title { font-size: 32px; font-weight: 900; letter-spacing: 2px; }
    .scores { display: flex; gap: 8px; }
    .score-box {
      background: #151515;
      border: 1px solid #333;
      padding: 6px 12px;
      text-align: center;
      min-width: 65px;
    }
    .score-label { font-size: 9px; color: #888; text-transform: uppercase; }
    .score-val { font-size: 14px; font-weight: bold; margin-top: 2px; }
    .board-container {
      position: relative;
      width: 340px;
      height: 340px;
      background: #111;
      border: 2px solid #fff;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-gap: 10px;
      border-radius: 4px;
    }
    .cell {
      background: #1e1e1e;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 900;
      transition: transform 0.1s, background-color 0.1s;
    }
    .cell[data-val="2"] { background: #2a2a2a; color: #fff; }
    .cell[data-val="4"] { background: #3d3d3d; color: #fff; }
    .cell[data-val="8"] { background: #555555; color: #fff; }
    .cell[data-val="16"] { background: #777777; color: #000; }
    .cell[data-val="32"] { background: #999999; color: #000; }
    .cell[data-val="64"] { background: #b8b8b8; color: #000; }
    .cell[data-val="128"] { background: #d5d5d5; color: #000; font-size: 20px; }
    .cell[data-val="256"] { background: #ececec; color: #000; font-size: 20px; box-shadow: 0 0 10px #fff; }
    .cell[data-val="512"] { background: #ffffff; color: #000; font-size: 20px; box-shadow: 0 0 14px #fff; }
    .cell[data-val="1024"] { background: #ffffff; color: #000; font-size: 16px; border: 2px solid #000; }
    .cell[data-val="2048"] { background: #ffffff; color: #000; font-size: 16px; border: 3px double #000; box-shadow: 0 0 20px #fff; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .btn {
      background: #fff;
      color: #000;
      border: none;
      padding: 10px 20px;
      font-family: monospace;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }
    .btn:hover { background: #ccc; }
    .hint { font-size: 11px; color: #777; margin-top: 12px; font-family: monospace; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">2048</div>
    <div class="scores">
      <div class="score-box">
        <div class="score-label">SCORE</div>
        <div class="score-val" id="score">0</div>
      </div>
      <div class="score-box">
        <div class="score-label">BEST</div>
        <div class="score-val" id="best">0</div>
      </div>
    </div>
  </div>

  <div class="board-container" id="board">
    <div id="gameOverOverlay" class="overlay" style="display: none;">
      <h2 id="overTitle" style="font-size: 24px;">GAME OVER</h2>
      <button class="btn" id="restartBtn">NEW GAME</button>
    </div>
  </div>

  <div style="margin-top: 12px; display: flex; gap: 8px;">
    <button class="btn" id="newGameBtn" style="padding: 6px 14px;">NEW GAME</button>
  </div>
  <div class="hint">Use Arrow Keys or Swipe to slide tiles</div>

  <script>
    const board = document.getElementById('board');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const overTitle = document.getElementById('overTitle');

    let grid = Array(4).fill(null).map(() => Array(4).fill(0));
    let score = 0;
    let best = parseInt(localStorage.getItem('2048_best') || '0', 10);
    bestEl.textContent = best;

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function playBeep(freq, dur = 0.05) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch (e) {}
    }

    function initCells() {
      // Clear previous cells except overlay
      const cells = board.querySelectorAll('.cell');
      cells.forEach(c => c.remove());
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.id = `cell-${r}-${c}`;
          board.appendChild(cell);
        }
      }
    }

    function addRandomTile() {
      const empty = [];
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (grid[r][c] === 0) empty.push({ r, c });
        }
      }
      if (empty.length > 0) {
        const { r, c } = empty[Math.floor(Math.random() * empty.length)];
        grid[r][c] = Math.random() < 0.9 ? 2 : 4;
      }
    }

    function render() {
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const val = grid[r][c];
          const cell = document.getElementById(`cell-${r}-${c}`);
          cell.textContent = val > 0 ? val : '';
          cell.setAttribute('data-val', val > 0 ? val : '');
        }
      }
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem('2048_best', best);
      }
    }

    function slideRow(row) {
      let filtered = row.filter(val => val !== 0);
      for (let i = 0; i < filtered.length - 1; i++) {
        if (filtered[i] === filtered[i + 1]) {
          filtered[i] *= 2;
          score += filtered[i];
          filtered[i + 1] = 0;
          playBeep(440 + filtered[i] * 2);
        }
      }
      filtered = filtered.filter(val => val !== 0);
      while (filtered.length < 4) {
        filtered.push(0);
      }
      return filtered;
    }

    function moveLeft() {
      let moved = false;
      for (let r = 0; r < 4; r++) {
        const newRow = slideRow(grid[r]);
        if (newRow.some((val, i) => val !== grid[r][i])) moved = true;
        grid[r] = newRow;
      }
      return moved;
    }

    function rotateGrid() {
      const newGrid = Array(4).fill(null).map(() => Array(4).fill(0));
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          newGrid[c][3 - r] = grid[r][c];
        }
      }
      grid = newGrid;
    }

    function move(dir) {
      let moved = false;
      if (dir === 'left') {
        moved = moveLeft();
      } else if (dir === 'down') {
        rotateGrid();
        moved = moveLeft();
        rotateGrid(); rotateGrid(); rotateGrid();
      } else if (dir === 'right') {
        rotateGrid(); rotateGrid();
        moved = moveLeft();
        rotateGrid(); rotateGrid();
      } else if (dir === 'up') {
        rotateGrid(); rotateGrid(); rotateGrid();
        moved = moveLeft();
        rotateGrid();
      }

      if (moved) {
        addRandomTile();
        render();
        if (checkGameOver()) {
          overTitle.textContent = 'GAME OVER';
          gameOverOverlay.style.display = 'flex';
          playBeep(200, 0.3);
        }
      }
    }

    function checkGameOver() {
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (grid[r][c] === 0) return false;
          if (r < 3 && grid[r][c] === grid[r + 1][c]) return false;
          if (c < 3 && grid[r][c] === grid[r][c + 1]) return false;
        }
      }
      return true;
    }

    function resetGame() {
      grid = Array(4).fill(null).map(() => Array(4).fill(0));
      score = 0;
      gameOverOverlay.style.display = 'none';
      initCells();
      addRandomTile();
      addRandomTile();
      render();
    }

    document.getElementById('restartBtn').onclick = resetGame;
    document.getElementById('newGameBtn').onclick = resetGame;

    window.addEventListener('keydown', (e) => {
      if (['ArrowLeft', 'KeyA'].includes(e.code)) { move('left'); e.preventDefault(); }
      else if (['ArrowRight', 'KeyD'].includes(e.code)) { move('right'); e.preventDefault(); }
      else if (['ArrowUp', 'KeyW'].includes(e.code)) { move('up'); e.preventDefault(); }
      else if (['ArrowDown', 'KeyS'].includes(e.code)) { move('down'); e.preventDefault(); }
    });

    let touchStartX = 0, touchStartY = 0;
    board.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });

    board.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
        if (dx > 0) move('right'); else move('left');
      } else if (Math.abs(dy) > 30) {
        if (dy > 0) move('down'); else move('up');
      }
    }, { passive: true });

    resetGame();
  </script>
</body>
</html>
